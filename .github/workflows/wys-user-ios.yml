name: iOS Build WYS-USER

on:
  workflow_dispatch:
    inputs:
      bump_build:
        description: '是否自动增加 build 号'
        required: true
        type: boolean
        default: true
      use_jiagu:
        description: '是否加固'
        required: true
        type: boolean
        default: true
      flavor:
        description: "构建环境"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - beta
      branch:
        description: "构建分支"
        required: true
        default: "main"
        type: string
jobs:
  build:
    name: CI Build
    runs-on: macos-15

    steps:
      - name: Check runner location
        run: |
          echo "Runner public IP and approximate location:"
          curl --fail --silent --show-error --max-time 10 https://ipinfo.io/json || echo "Runner location lookup unavailable"

      - name: Ping jiagu server
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        run: |
          if ping -c 4 -W 3000 runenc.ijiami.cn; then
            echo "Jiagu server responded to ping"
          else
            echo "Jiagu server did not respond to ping (ICMP may be blocked)"
          fi

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: |
          ls -1 /Applications | grep -E '^Xcode.*\.app$' || true

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

# 设置SSH KEY
      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan codeup.aliyun.com >> "$HOME/.ssh/known_hosts"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

# Clone Repo
      - name: Clone target repo
        run: git clone --recursive "$WYS_USER_URL" -b ${{ github.event.inputs.branch }}
        env:
          WYS_USER_URL: ${{ secrets.WYS_USER_URL }}
          WYS_USER_BRANCH: ${{ secrets.WYS_USER_BRANCH }}

      - name: Build / Base repo dir
        run: |
          echo "BUILD_REPO_DIR=${GITHUB_WORKSPACE}/wanyisheng" >> "$GITHUB_ENV"

      - name: Install JMAppSigner
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        run: |
          dmg_path="${BUILD_REPO_DIR}/fastlane/jiagu/JMAppSigner.dmg"
          if [ ! -f "$dmg_path" ]; then
            echo "JMAppSigner DMG not found: ${dmg_path}"
            exit 1
          fi

          echo "40c394c1711d30677a7208315ee24ca8bd0ab7bce7d050c5a4f1c64463e776aa  ${dmg_path}" | shasum -a 256 -c -

          mount_output=$(hdiutil attach -nobrowse -readonly "$dmg_path")
          mount_path=$(echo "$mount_output" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')
          signer_app=$(find "$mount_path" -maxdepth 2 -type d -name 'JMAppSigner.app' -print -quit)
          if [ -z "$signer_app" ]; then
            echo "JMAppSigner.app not found in DMG"
            exit 1
          fi

          sudo ditto "$signer_app" /Applications/JMAppSigner.app
          hdiutil detach "$mount_path"
          test -x /Applications/JMAppSigner.app/Contents/MacOS/JMReSign
          codesign --verify --deep --strict --verbose=2 /Applications/JMAppSigner.app

# 版本号自动+1
      - name: Bump build number & push
        if: ${{ github.event.inputs.bump_build == 'true' }}
        run: |
          cd wanyisheng
          
          # 读取 pubspec.yaml version
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1 | awk '{print $2}')
          OLD_BUILD=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          OLD_BUILD=${OLD_BUILD:-0}

          # 获取今天日期 (yyyyMMdd)
          TODAY=$(date +%Y%m%d)

          # 提取旧 build 号的日期部分和计数部分
          OLD_DATE=${OLD_BUILD:0:8}
          OLD_COUNT=${OLD_BUILD:8:1}
          OLD_COUNT=${OLD_COUNT:-0}

          if [ "$OLD_DATE" = "$TODAY" ]; then
            # 如果是今天，计数+1
            NEW_COUNT=$((OLD_COUNT + 1))
          else
            # 如果不是今天，重置为0
            NEW_COUNT=0
          fi

          NEW_BUILD_NUM="${TODAY}${NEW_COUNT}"

          echo "Current version: $VERSION_NAME+$OLD_BUILD"
          echo "New build number: $NEW_BUILD_NUM"
          
          # 替换 pubspec.yaml
          # 兼容 macOS 和 Linux 的 sed
          if [ "${{ runner.os }}" = "macOS" ]; then
            sed -i "" "s/^version:.*/version: $VERSION_NAME+$NEW_BUILD_NUM/" pubspec.yaml
          else
            sed -i "s/^version:.*/version: $VERSION_NAME+$NEW_BUILD_NUM/" pubspec.yaml
          fi
          echo "NEW_BUILD_NUM=$NEW_BUILD_NUM" >> $GITHUB_ENV
          
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "release: $VERSION_NAME+$NEW_BUILD_NUM" || echo "No changes to commit"
          git push
          cd ..

# 安装Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wanyisheng/pubspec.yaml

      - run: flutter --version

# 动态修改 pubspec.yaml 的 icon 路径
      - name: Set launcher icon
        run: |
          cd "$BUILD_REPO_DIR"
          if [ "${{ github.event.inputs.flavor }}" = "beta" ]; then
            echo "⚙️ 切换为 Beta 图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon_beta.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon_beta.png"
            ' pubspec.yaml
          else
            echo "⚙️ 使用正式版图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon.png"
            ' pubspec.yaml
          fi

      - name: Build / Launcher icons
        run: |
          cd "$BUILD_REPO_DIR"
          rm -f ~/.pub-cache/hosted/pub.flutter-io.cn/.cache/*-advisories.json || true
          dart run flutter_launcher_icons
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Build / Install CocoaPods
        run: |
          echo "Ensuring Homebrew CocoaPods is available"
          if brew list --versions cocoapods >/dev/null 2>&1; then
            brew reinstall cocoapods
          else
            brew install cocoapods
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:${PATH}"
          hash -r
          echo "Resolved pod binary after Homebrew setup: $(command -v pod)"
          pod --version

      - name: Build / Verify CocoaPods
        run: |
          cd "$BUILD_REPO_DIR/ios"
          echo "Ruby: $(command -v ruby)"
          ruby --version
          echo "Bundle: $(command -v bundle)"
          echo "Pod: $(command -v pod)"
          echo "PATH=${PATH}"
          if [ "$(command -v pod)" != "$(brew --prefix)/bin/pod" ]; then
            echo "Expected Homebrew pod at $(brew --prefix)/bin/pod"
            exit 1
          fi
          pod --version
          if [ -f "Flutter/Generated.xcconfig" ]; then
            echo "Flutter/Generated.xcconfig exists"
          else
            echo "Flutter/Generated.xcconfig does not exist yet; fastlane will generate it during flutter pub get"
          fi

# Build Flutter
      - name: Build / IPA
        if: ${{ github.event.inputs.use_jiagu != 'true' }}
        run: |
          cd "$BUILD_REPO_DIR/ios"
          echo "Building base IPA from: $PWD"
          rm -f ~/.pub-cache/hosted/pub.flutter-io.cn/.cache/*-advisories.json || true
          export PATH="$(brew --prefix)/bin:${PATH}"
          hash -r
          echo "Pod used by Build / IPA: $(command -v pod)"
          fastlane ios release_beta flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.BINZHOU_MATCH_PASSWORD }}
          APP_STORE_KEY_ID: ${{ secrets.BINZHOU_AUTH_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.BINZHOU_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.BINZHOU_AUTH_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.BINZHOU_APPLE_TEAM_ID }}

      - name: Build / IPA Jiagu
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        run: |
          cd "$BUILD_REPO_DIR/ios"
          echo "Building jiagu IPA from: $PWD"
          rm -f ~/.pub-cache/hosted/pub.flutter-io.cn/.cache/*-advisories.json || true
          export PATH="$(brew --prefix)/bin:${PATH}"
          hash -r
          echo "Pod used by Build / IPA Jiagu: $(command -v pod)"
          fastlane ios release_beta_jiagu flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.BINZHOU_MATCH_PASSWORD }}
          APP_STORE_KEY_ID: ${{ secrets.BINZHOU_AUTH_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.BINZHOU_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.BINZHOU_AUTH_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.BINZHOU_APPLE_TEAM_ID }}

      - name: Build / Resolve outputs
        if: ${{ github.event.inputs.use_jiagu != 'true' }}
        run: |
          archive_path=$(find "$BUILD_REPO_DIR" -name '*.xcarchive' -not -path '*/Pods/*' -not -path '*/DerivedData/*' -print | sort | tail -n 1)
          original_ipa_path=$(find "$BUILD_REPO_DIR" -name '*.ipa' -not -path '*/Pods/*' -not -path '*/DerivedData/*' -print | sort | tail -n 1)
          echo "Resolved archive_path=${archive_path}"
          echo "Resolved original_ipa_path=${original_ipa_path}"

          if [ -z "$archive_path" ]; then
            echo "No xcarchive found under ${BUILD_REPO_DIR}"
            exit 1
          fi

          if [ -z "$original_ipa_path" ]; then
            echo "No ipa found under ${BUILD_REPO_DIR}"
            exit 1
          fi

          echo "ARCHIVE_PATH=${archive_path}" >> "$GITHUB_ENV"
          echo "ORIGINAL_IPA_PATH=${original_ipa_path}" >> "$GITHUB_ENV"

      - name: Build / Final IPA name
        run: |
          cd "$BUILD_REPO_DIR"
          version_str=$(grep -m 1 -E '^version:' pubspec.yaml | sed 's/version: //; s/+/_/')
          if [ "${{ github.event.inputs.use_jiagu }}" = "true" ]; then
            jiagu_suffix="_jiagu"
          else
            jiagu_suffix=""
          fi
          ipa_name="wys_user_${version_str}_${{ github.event.inputs.flavor }}${jiagu_suffix}.ipa"
          echo "IPA_NAME=${ipa_name}" >> "$GITHUB_ENV"

      - name: Build / Final IPA path
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        run: |
          case "$IPA_NAME" in
            *_jiagu.ipa) ;;
            *)
              echo "Refusing non-jiagu artifact name: ${IPA_NAME}"
              exit 1
              ;;
          esac
          final_stage_path="${BUILD_REPO_DIR}/${IPA_NAME}"
          final_dsym_path="${final_stage_path%.ipa}.dSYM.zip"
          echo "FINAL_IPA_PATH=${final_stage_path}" >> "$GITHUB_ENV"
          echo "FINAL_DSYM_PATH=${final_dsym_path}" >> "$GITHUB_ENV"
          if [ ! -f "$final_stage_path" ]; then
            echo "Final jiagu IPA not found at ${final_stage_path}"
            exit 1
          fi
          if [ ! -f "$final_dsym_path" ]; then
            echo "Final jiagu dSYM not found at ${final_dsym_path}"
            exit 1
          fi
          echo "use_jiagu=true, final IPA is staged at: ${final_stage_path}"

      - name: Build / Final IPA path
        if: ${{ github.event.inputs.use_jiagu != 'true' }}
        run: |
          echo "use_jiagu=false, final IPA is original IPA: ${ORIGINAL_IPA_PATH}"
          echo "FINAL_IPA_PATH=${ORIGINAL_IPA_PATH}" >> "$GITHUB_ENV"

      - name: Upload / Stage final IPA
        run: |
          final_output="${GITHUB_WORKSPACE}/${IPA_NAME}"
          echo "Staging final IPA to: ${final_output}"
          echo "Source final IPA: ${FINAL_IPA_PATH}"
          cp "$FINAL_IPA_PATH" "$final_output"
          echo "PACKAGED_IPA_PATH=${final_output}" >> "$GITHUB_ENV"

      - name: Upload / Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.PACKAGED_IPA_PATH }}

      - name: Upload / Jiagu dSYM
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-dSYM
          path: ${{ env.FINAL_DSYM_PATH }}

      - name: Write iOS test summary
        id: ios_summary
        continue-on-error: true
        working-directory: wanyisheng
        run: |
          trap 'echo "::warning::iOS 测试链接配置读取失败，不影响已完成的打包"' ERR
          version_raw=$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0])["version"].to_s.strip' pubspec.yaml)
          {
            printf '### iOS 测试安装（WYS-USER）\n\n'
            printf '| 项 | 值 |\n|---|---|\n'
            printf '| 版本 | %s（%s） |\n' "$version_raw" "$FLAVOR"
          } >> "$GITHUB_STEP_SUMMARY"
          test_url=$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0])["ios_test_url"].to_s.strip' pubspec.yaml)
          if [ -z "$test_url" ]; then
            echo "::warning::pubspec.yaml 未配置 ios_test_url，跳过测试链接和二维码展示"
            exit 0
          fi
          printf '| TestFlight 测试链接 | [%s](%s) |\n' "$test_url" "$test_url" >> "$GITHUB_STEP_SUMMARY"
          echo "test_url=${test_url}" >> "$GITHUB_OUTPUT"
        env:
          FLAVOR: ${{ github.event.inputs.flavor }}

      - name: Generate iOS test QR code
        if: ${{ success() && steps.ios_summary.outputs.test_url != '' }}
        continue-on-error: true
        working-directory: wanyisheng
        run: |
          trap 'echo "::warning::iOS 二维码生成、上传或访问校验失败，测试链接已保留；请检查 OSS 配置、HTTPS 证书和公开访问权限"' ERR
          case "$FLAVOR" in
            production) path_index=1 ;;
            beta) path_index=0 ;;
            *) echo "Unsupported flavor: ${FLAVOR}" >&2; exit 1 ;;
          esac
          oss_base=$(ruby -ryaml -e 'paths = YAML.load_file(ARGV[1])["oss_upload_path"].to_s.split(","); puts paths[ARGV[0].to_i]' "$path_index" pubspec.yaml)
          download_base=$(ruby -ryaml -e 'paths = YAML.load_file(ARGV[1])["oss_file_path"].to_s.split(","); puts paths[ARGV[0].to_i]' "$path_index" pubspec.yaml)
          if [ -z "$oss_base" ] || [ -z "$download_base" ]; then
            echo "::warning::OSS path configuration is missing for flavor: ${FLAVOR}"
            exit 1
          fi
          qr_venv="${RUNNER_TEMP}/ios-qr-venv"
          python3 -m venv "$qr_venv"
          "${qr_venv}/bin/python" -m pip install --disable-pip-version-check --retries 2 --timeout 30 'qrcode[pil]==8.2'
          qr_name="${IPA_NAME%.ipa}_ios_qrcode.png"
          qr_path="${RUNNER_TEMP}/${qr_name}"
          qr_object="${oss_base%/}/${qr_name}"
          qr_url="${download_base%/}/${qr_name}"
          QR_METADATA=$(ruby -ryaml -rjson -e 'config = YAML.load_file(ARGV[0]); puts({description: config["description"], version: config["version"]}.to_json)' "${QR_REPO_DIR}/pubspec.yaml")
          QR_COMMIT=$(git -C "$QR_REPO_DIR" rev-parse --short=9 HEAD)
          export QR_METADATA QR_COMMIT
          "${qr_venv}/bin/python" - "$IOS_TEST_URL" "$qr_path" <<'PYTHON'
          import json
          import os
          import sys

          import qrcode
          from PIL import Image, ImageDraw, ImageFont

          metadata = json.loads(os.environ["QR_METADATA"])
          description = " ".join((metadata.get("description") or "").split())
          version = str(metadata.get("version") or "").strip()
          if not description or not version:
              raise ValueError("pubspec.yaml must provide description and version")
          caption_parts = [
              (description, f" · {os.environ['QR_PLATFORM']}"),
              (version, ""),
              (os.environ["QR_BRANCH"], f" · {os.environ['QR_COMMIT']}"),
          ]
          font = None
          for font_path in (
              "/System/Library/Fonts/Supplemental/Arial Unicode.ttf",
              "/System/Library/Fonts/Hiragino Sans GB.ttc",
              "/System/Library/Fonts/STHeiti Light.ttc",
          ):
              try:
                  font = ImageFont.truetype(font_path, size=20)
                  break
              except OSError:
                  continue
          if font is None:
              raise RuntimeError("No Chinese font is available for the QR caption")
          qr_image = qrcode.make(
              sys.argv[1], error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=6, border=4,
          ).convert("RGB")
          # Trim only the bottom white margin; keep QR modules untouched.
          qr_image = qr_image.crop((0, 0, qr_image.width, qr_image.height - 12))
          padding, line_gap = 16, 6
          caption_gap, bottom_padding = 0, 4
          width = qr_image.width
          max_text_width = width - 2 * padding

          def fit_line(text, suffix):
              for size in range(20, 13, -1):
                  line_font = font.font_variant(size=size)
                  left, top, right, bottom = line_font.getbbox(text + suffix)
                  if right - left <= max_text_width:
                      return text + suffix, line_font
              # Keep the platform or full commit SHA while shortening the middle.
              for keep in range(len(text) - 1, -1, -1):
                  head, tail = (keep + 1) // 2, keep // 2
                  shortened = text[:head] + "…" + (text[-tail:] if tail else "") + suffix
                  left, top, right, bottom = line_font.getbbox(shortened)
                  if right - left <= max_text_width:
                      return shortened, line_font
              raise ValueError("QR caption suffix exceeds the available width")

          captions = [fit_line(text, suffix) for text, suffix in caption_parts]
          bounds = [line_font.getbbox(line) for line, line_font in captions]
          text_height = sum(bottom - top for left, top, right, bottom in bounds) + line_gap * (len(captions) - 1)
          image = Image.new("RGB", (width, qr_image.height + caption_gap + text_height + bottom_padding), "white")
          image.paste(qr_image, (0, 0))
          draw = ImageDraw.Draw(image)
          y = qr_image.height + caption_gap
          for (line, line_font), (left, top, right, bottom) in zip(captions, bounds):
              x = (width - (right - left)) // 2 - left
              text_y = y - top
              draw.text((x, text_y), line, font=line_font, fill="black")
              y += bottom - top + line_gap
          image.save(sys.argv[2], "PNG")
          PYTHON
          sudo -v
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config -e oss-cn-beijing.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH
          ossutil cp -f "$qr_path" "$qr_object"
          qr_check_path="${RUNNER_TEMP}/${qr_name}.check"
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 45 --connect-timeout 10 --max-time 20 "$qr_url" --output "$qr_check_path"
          cmp "$qr_path" "$qr_check_path"
          printf '\n### 扫码安装\n\n[![扫码安装](%s)](%s)\n' "$qr_url" "$IOS_TEST_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          QR_REPO_DIR: ${{ github.workspace }}/wanyisheng
          QR_PLATFORM: iOS
          QR_BRANCH: ${{ github.event.inputs.branch }}
          FLAVOR: ${{ github.event.inputs.flavor }}
          IOS_TEST_URL: ${{ steps.ios_summary.outputs.test_url }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

# 飞书机器人通知
      - name: Notify / FeiShu
        if: always() && !cancelled()  # 排除取消状态
        run: |
          cd "$BUILD_REPO_DIR/fastlane"
          echo "Sending FeiShu notification from: $PWD"
          fastlane notify_fei_shu flavor:${{ github.event.inputs.flavor }} branch:${{ github.event.inputs.branch }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
