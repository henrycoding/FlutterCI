name: Android Build PUMP Watch

on:
  workflow_dispatch:
    inputs:
      bump_build:
        description: "是否自动增加 build 号"
        required: true
        type: boolean
        default: true
      use_jiagu:
        description: "是否加固"
        required: true
        type: boolean
        default: true
      branch:
        description: "构建分支"
        required: true
        type: string
        default: main

concurrency:
  group: pump-watch-build-${{ inputs.branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: CI Build
    runs-on: macos-latest
    env:
      EXPECTED_PACKAGE: com.hengyue.ytj.pump
      WATCH_BRANCH: ${{ inputs.branch }}
      ORIGINAL_APK: ${{ github.workspace }}/pump_watch/build/app/outputs/flutter-apk/app-release.apk
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_HIDE_CHANGELOG: "true"
    steps:
      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          ssh-keyscan codeup.aliyun.com >> "$HOME/.ssh/known_hosts"
          git config --global url."git@codeup.aliyun.com:".insteadOf "https://codeup.aliyun.com/"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone watch repo
        id: clone
        run: |
          if [[ -z "$PUMP_WATCH_URL" ]]; then
            echo "::error::Missing PUMP_WATCH_URL"
            exit 1
          fi
          git check-ref-format --branch "$WATCH_BRANCH" >/dev/null
          for attempt in 1 2 3; do
            clone_dir=$(mktemp -d "$RUNNER_TEMP/pump-watch-clone.XXXXXX")
            if git clone --depth 1 --single-branch --no-tags --branch "$WATCH_BRANCH" -- "$PUMP_WATCH_URL" "$clone_dir"; then
              mv "$clone_dir" pump_watch
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Watch repository clone failed (attempt $attempt/3), retrying"
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Could not clone the watch repository after 3 attempts"
          exit 1
        env:
          PUMP_WATCH_URL: ${{ secrets.PUMP_WATCH_URL }}

      - name: Checkout watch submodules
        working-directory: pump_watch
        run: |
          for attempt in 1 2 3; do
            if git submodule update --init --recursive; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Watch submodule checkout failed (attempt $attempt/3), retrying"
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Could not check out the watch submodules after 3 attempts"
          exit 1

      - name: Check watch build configuration
        working-directory: pump_watch
        run: |
          package_name=$(sed -nE "s/^[[:space:]]*applicationId[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" android/app/build.gradle)
          if [[ "$package_name" != "$EXPECTED_PACKAGE" ]]; then
            echo "::error::Expected $EXPECTED_PACKAGE on $WATCH_BRANCH, found ${package_name:-<missing>}"
            exit 1
          fi
          if [[ ! -f fastlane/Fastfile ]]; then
            echo "::error::fastlane/Fastfile is missing from $WATCH_BRANCH"
            exit 1
          fi
          if [[ "$USE_JIAGU" == true && ! -s fastlane/jiagu/encryptionTool.jar ]]; then
            echo "::error::fastlane/jiagu/encryptionTool.jar is missing from $WATCH_BRANCH"
            exit 1
          fi
          ruby -ryaml <<'RUBY'
          config = YAML.load_file("pubspec.yaml")
          required = %w[description version oss_upload_path oss_file_path fei_shu_webhook]
          required += %w[jia_gu_username jia_gu_password jia_gu_strategy] if ENV["USE_JIAGU"] == "true"
          missing = required.select { |key| config[key].to_s.strip.empty? }
          abort "::error::pubspec.yaml is missing #{missing.join(", ")}" unless missing.empty?

          upload_base = config.fetch("oss_upload_path").strip
          download_base = config.fetch("oss_file_path").strip
          abort "::error::Invalid oss_upload_path or oss_file_path" unless upload_base.start_with?("oss://") && download_base.start_with?("https://")
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
            file.puts "OSS_UPLOAD_BASE=#{upload_base}", "OSS_DOWNLOAD_BASE=#{download_base}"
          end
          RUBY
        env:
          USE_JIAGU: ${{ inputs.use_jiagu }}

      - name: Bump build number and push
        if: inputs.bump_build
        working-directory: pump_watch
        run: |
          version=$(ruby -ryaml -e 'puts YAML.load_file("pubspec.yaml").fetch("version")')
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Invalid watch version in pubspec.yaml"
            exit 1
          fi
          version_name=${BASH_REMATCH[1]}
          old_build=${BASH_REMATCH[2]}
          today=$(date +%Y%m%d)
          old_date=${old_build:0:8}
          old_count=${old_build:8}
          new_count=0
          if [[ "$old_date" == "$today" && "$old_count" =~ ^[0-9]+$ ]]; then
            new_count=$((10#$old_count + 1))
          fi
          new_version="${version_name}+${today}${new_count}"
          sed -i '' "s/^version:.*/version: ${new_version}/" pubspec.yaml
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "release: ${new_version}"
          git push origin "HEAD:refs/heads/${WATCH_BRANCH}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            pump_watch/android/**/*.gradle*
            pump_watch/android/gradle.properties
            pump_watch/android/gradle/wrapper/gradle-wrapper.properties
            pump_watch/plugins/**/*.gradle*
            pump_watch/pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pump_watch/pubspec.yaml
          cache: true

      - name: Set up Android SDK and verify toolchain
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;23.1.7779620"
          printf '%s\n' "$sdk_root/build-tools/34.0.0" >> "$GITHUB_PATH"
          flutter config --jdk-dir="$JAVA_HOME"
          flutter --version
          fastlane --version

      - name: Build APK
        working-directory: pump_watch
        run: fastlane build_flutter
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Set artifact name
        working-directory: pump_watch
        run: |
          version=$(ruby -ryaml -e 'puts YAML.load_file("pubspec.yaml").fetch("version")')
          suffix=""
          if [[ "$USE_JIAGU" == true ]]; then
            suffix="_jiagu"
          fi
          {
            printf 'APK_NAME=pump_watch_%s%s.apk\n' "${version/+/_}" "$suffix"
            printf 'APP_VERSION=%s\n' "$version"
          } >> "$GITHUB_ENV"
        env:
          USE_JIAGU: ${{ inputs.use_jiagu }}

      - name: Protect APK
        if: inputs.use_jiagu
        working-directory: pump_watch
        run: |
          out_dir="$GITHUB_WORKSPACE/pump_watch/build/jiagu"
          fastlane jiagu apk_path:"$ORIGINAL_APK" out_dir:"$out_dir" out_name:jiagu_output
          protected_apk="$out_dir/jiagu_output.apk"
          test -s "$protected_apk"
          printf 'PROTECTED_APK_PATH=%s\n' "$protected_apk" >> "$GITHUB_ENV"

      - name: Sign protected APK
        if: inputs.use_jiagu
        working-directory: pump_watch
        run: |
          signed_apk="$RUNNER_TEMP/$APK_NAME"
          fastlane sign_apk input_apk:"$PROTECTED_APK_PATH" output_apk:"$signed_apk"
          printf 'FINAL_APK_PATH=%s\n' "$signed_apk" >> "$GITHUB_ENV"

      - name: Select unprotected APK
        if: ${{ !inputs.use_jiagu }}
        run: printf 'FINAL_APK_PATH=%s\n' "$ORIGINAL_APK" >> "$GITHUB_ENV"

      - name: Validate and stage APK
        run: |
          test -s "$FINAL_APK_PATH"
          zipalign -c -v 4 "$FINAL_APK_PATH"
          final_cert=$(apksigner verify --verbose --print-certs "$FINAL_APK_PATH")
          printf '%s\n' "$final_cert"
          if [[ "$FINAL_APK_PATH" != "$ORIGINAL_APK" ]]; then
            original_cert=$(apksigner verify --print-certs "$ORIGINAL_APK")
            cert_pattern='^Signer #[0-9]+ certificate SHA-256 digest: '
            final_digest=$(printf '%s\n' "$final_cert" | grep -E "$cert_pattern")
            original_digest=$(printf '%s\n' "$original_cert" | grep -E "$cert_pattern")
            if [[ "$final_digest" != "$original_digest" ]]; then
              echo "::error::Protected APK signer differs from the original watch release APK"
              exit 1
            fi
          fi
          package_name=$(aapt dump badging "$FINAL_APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [[ "$package_name" != "$EXPECTED_PACKAGE" ]]; then
            echo "::error::Unexpected Android package: ${package_name:-<missing>}"
            exit 1
          fi

          packaged_apk="$GITHUB_WORKSPACE/$APK_NAME"
          cp "$FINAL_APK_PATH" "$packaged_apk"
          {
            printf 'PACKAGED_APK_PATH=%s\n' "$packaged_apk"
            printf 'OSS_OBJECT=%s/%s\n' "${OSS_UPLOAD_BASE%/}" "$APK_NAME"
            printf 'OSS_DOWNLOAD_URL=%s/%s\n' "${OSS_DOWNLOAD_BASE%/}" "$APK_NAME"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.PACKAGED_APK_PATH }}
          if-no-files-found: error

      - name: Upload APK to OSS
        run: |
          sudo -v
          curl --fail --show-error --silent https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config -e oss-cn-beijing.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH
          ossutil cp -f "$PACKAGED_APK_PATH" "$OSS_OBJECT"
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Write APK summary
        run: |
          apk_md5=$(md5 -q "$PACKAGED_APK_PATH")
          {
            printf '### PUMP Android 手表安装包\n\n'
            printf '| 项 | 值 |\n|---|---|\n'
            printf '| 版本 | %s |\n' "$APP_VERSION"
            printf '| 下载地址（升级后台 url） | [%s](%s) |\n' "$OSS_DOWNLOAD_URL" "$OSS_DOWNLOAD_URL"
            printf '| MD5（升级后台 mdfiveStr） | `%s` |\n' "$apk_md5"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show QR code in summary
        continue-on-error: true
        run: |
          qr_commit=$(git -C "$QR_REPO_DIR" rev-parse --short=9 HEAD)
          qr_query=$(ruby -ruri -ryaml -e '
            config = YAML.load_file(File.join(ENV.fetch("QR_REPO_DIR"), "pubspec.yaml"))
            description = config.fetch("description").split.join(" ")
            caption = [
              "#{description} · #{ENV.fetch("QR_PLATFORM")}",
              config.fetch("version"),
              "#{ENV.fetch("QR_BRANCH")} · #{ARGV.fetch(1)}"
            ].join("\n")
            puts URI.encode_www_form(text: ARGV.fetch(0), caption: caption, size: 320, margin: 4,
                                    format: "png", captionFontFamily: "Noto Sans CJK SC", captionFontSize: 17)
          ' "$OSS_DOWNLOAD_URL" "$qr_commit")
          qr_url="https://quickchart.io/qr?$qr_query"
          printf '\n### 扫码下载\n\n[![扫码下载](%s)](<%s>)\n' "$qr_url" "$OSS_DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          QR_REPO_DIR: ${{ github.workspace }}/pump_watch
          QR_PLATFORM: Android 手表
          QR_BRANCH: ${{ inputs.branch }}

      - name: Notify FeiShu
        if: always() && !cancelled() && steps.clone.outcome == 'success'
        working-directory: pump_watch
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fastlane notify_fei_shu branch:"$WATCH_BRANCH" artifact_url:"${OSS_DOWNLOAD_URL:-}" run_url:"$run_url"
        env:
          JOB_STATUS: ${{ job.status }}
