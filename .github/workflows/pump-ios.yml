name: iOS Build PUMP

on:
  workflow_dispatch:
    inputs:
      bump_build:
        description: "是否自动增加 build 号"
        required: true
        type: boolean
        default: true
      use_jiagu:
        description: "是否加固"
        required: true
        type: boolean
        default: true
      flavor:
        description: "构建环境"
        required: true
        type: choice
        default: production
        options:
          - production
          - beta
      branch:
        description: "构建分支"
        required: true
        type: string
        default: main

concurrency:
  group: pump-build-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  build:
    name: CI Build
    runs-on: macos-15

    steps:
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan codeup.aliyun.com >> "$HOME/.ssh/known_hosts"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          git config --global url."git@codeup.aliyun.com:".insteadOf "https://codeup.aliyun.com/"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone target repo
        run: git clone --recursive "$PUMP_URL" --branch "$INPUT_BRANCH" pump
        env:
          PUMP_URL: ${{ secrets.PUMP_URL }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}

      - name: Set build paths
        run: echo "BUILD_REPO_DIR=${GITHUB_WORKSPACE}/pump" >> "$GITHUB_ENV"

      - name: Install JMAppSigner
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        run: |
          dmg_path="${BUILD_REPO_DIR}/fastlane/jiagu/JMAppSigner.dmg"
          test -f "$dmg_path"
          echo "40c394c1711d30677a7208315ee24ca8bd0ab7bce7d050c5a4f1c64463e776aa  ${dmg_path}" | shasum -a 256 -c -
          mount_output=$(hdiutil attach -nobrowse -readonly "$dmg_path")
          mount_path=$(echo "$mount_output" | awk -F '\t' '/\/Volumes\// { print $NF; exit }')
          signer_app=$(find "$mount_path" -maxdepth 2 -type d -name JMAppSigner.app -print -quit)
          if [ -z "$signer_app" ]; then
            echo "JMAppSigner.app not found in DMG"
            exit 1
          fi
          sudo ditto "$signer_app" /Applications/JMAppSigner.app
          hdiutil detach "$mount_path"
          test -x /Applications/JMAppSigner.app/Contents/MacOS/JMReSign
          codesign --verify --deep --strict --verbose=2 /Applications/JMAppSigner.app

      - name: Bump build number and push
        if: ${{ github.event.inputs.bump_build == 'true' }}
        working-directory: pump
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version_name=$(echo "$version_line" | cut -d'+' -f1 | awk '{print $2}')
          old_build=$(echo "$version_line" | cut -s -d'+' -f2)
          today=$(date +%Y%m%d)
          old_date=${old_build:0:8}
          old_count=${old_build:8}
          if [ "$old_date" = "$today" ] && [[ "$old_count" =~ ^[0-9]+$ ]]; then
            new_count=$((10#$old_count + 1))
          else
            new_count=0
          fi
          new_build_num="${today}${new_count}"
          sed -i "" "s/^version:.*/version: ${version_name}+${new_build_num}/" pubspec.yaml
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "release: ${version_name}+${new_build_num}" || echo "No changes to commit"
          git push origin "HEAD:${{ github.event.inputs.branch }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pump/pubspec.yaml
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          fastlane --version

      - name: Build and upload IPA
        if: ${{ github.event.inputs.use_jiagu != 'true' }}
        working-directory: pump/ios
        run: fastlane ios release_beta flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_KEY_ID: ${{ secrets.AUTH_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.AUTH_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_HIDE_CHANGELOG: true

      - name: Build, protect and upload IPA
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        working-directory: pump/ios
        run: fastlane ios release_beta_jiagu flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_KEY_ID: ${{ secrets.AUTH_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.AUTH_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_HIDE_CHANGELOG: true

      - name: Resolve final IPA
        run: |
          cd pump
          version_str=$(grep -m 1 -E '^version:' pubspec.yaml | sed 's/version: //; s/+/_/')
          if [ "${{ github.event.inputs.use_jiagu }}" = "true" ]; then
            suffix="_jiagu"
          else
            suffix=""
          fi
          ipa_name="pump_${version_str}_${{ github.event.inputs.flavor }}${suffix}.ipa"
          if [ "${{ github.event.inputs.use_jiagu }}" = "true" ]; then
            source_ipa="${BUILD_REPO_DIR}/${ipa_name}"
            dsym_path="${source_ipa%.ipa}.dSYM.zip"
            test -f "$dsym_path"
            echo "FINAL_DSYM_PATH=${dsym_path}" >> "$GITHUB_ENV"
          else
            source_ipa=$(find "$BUILD_REPO_DIR" -name '*.ipa' -not -path '*/Pods/*' -not -path '*/DerivedData/*' -print | sort | tail -n 1)
          fi
          if [ -z "$source_ipa" ] || [ ! -f "$source_ipa" ]; then
            echo "Final IPA not found"
            exit 1
          fi
          packaged_ipa="${GITHUB_WORKSPACE}/${ipa_name}"
          cp "$source_ipa" "$packaged_ipa"
          echo "IPA_NAME=${ipa_name}" >> "$GITHUB_ENV"
          echo "PACKAGED_IPA_PATH=${packaged_ipa}" >> "$GITHUB_ENV"

      - name: Install QR encoder
        if: ${{ success() }}
        run: brew list qrencode >/dev/null 2>&1 || brew install qrencode || true

      - name: Upload iOS TestFlight QR to Feishu
        if: ${{ success() }}
        working-directory: pump
        run: |
          ios_test_url=$(ruby -ryaml -e 'puts YAML.load_file("pubspec.yaml")["ios_test_url"]')
          if [ -z "$ios_test_url" ]; then
            echo "ios_test_url is empty; continuing without QR image"
            exit 0
          fi
          qr_image_key=""
          if qr_image_key=$("${GITHUB_WORKSPACE}/.github/scripts/upload_feishu_qr.sh" "$ios_test_url"); then
            echo "FEISHU_QR_IMAGE_KEY=${qr_image_key}" >> "$GITHUB_ENV"
          else
            echo "Feishu QR upload failed; continuing without QR image"
          fi
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.PACKAGED_IPA_PATH }}

      - name: Upload protected dSYM artifact
        if: ${{ github.event.inputs.use_jiagu == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-dSYM
          path: ${{ env.FINAL_DSYM_PATH }}

      - name: Notify FeiShu
        if: always() && !cancelled()
        working-directory: pump/fastlane
        run: fastlane notify_fei_shu platform:iOS flavor:${{ github.event.inputs.flavor }} branch:${{ github.event.inputs.branch }} qr_image_key:"${FEISHU_QR_IMAGE_KEY:-}"
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
